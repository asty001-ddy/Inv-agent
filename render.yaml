# Render Blueprint: New > Blueprint > pick this repo. Every push to main redeploys automatically.
services:
  - type: web
    name: invoice-agent
    runtime: node
    region: frankfurt # closest Render region to Pakistan
    # Free works: the app visits its own /healthz every 10 minutes so Render doesn't put it to sleep.
    # Switch to "starter" for guaranteed always-on.
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TIMEZONE
        value: Asia/Karachi
      # ---- Secrets: Render asks for these when you create the Blueprint ----
      - key: GROQ_API_KEY
        sync: false
      - key: WHATSAPP_AGENT_TOKEN # WhatsApp > Settings > Agents > your agent > Chat info > API key
        sync: false
      - key: INVOICE_API_KEY
        generateValue: true # access key for the web form at your Render URL
      # ---- Printed on every invoice ----
      - key: BUSINESS_NAME
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false
      - key: BUSINESS_PHONE
        sync: false
      - key: BUSINESS_EMAIL
        sync: false
      - key: BUSINESS_TAX_ID
        sync: false
      - key: BANK_DETAILS
        sync: false
      - key: CURRENCY
        value: PKR
      - key: TAX_RATE
        value: "0"
